# Both non-default hook types must be installed for their gates to exist at all: the
# full-suite pytest below is pre-push, and cspell-commit-msg is commit-msg. Listing
# them here means a plain `prek install` writes all three, so the setup step
# cannot be half-done. Previously only pre-commit was installed, git lfs owned the
# pre-push slot, and the pytest gate silently never ran - a green commit, a red CI.
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
      # Every gate runs the tools from the uv-synced venv, so the versions pinned in
      # pyproject.toml are the single source of truth. Previously ruff came from the
      # astral-sh/ruff-pre-commit repo in its own isolated env, which drifted two
      # minor versions behind the ruff that gates CI - so ruff findings could pass
      # pre-commit and then fail CI.
      - repo: local
        hooks:
          - id: ruff-check
            name: ruff check
            entry: uv run ruff check . # add --fix to auto-fix fixable issues
            language: system
            types: [python]
            pass_filenames: false
            stages: [pre-commit]
          - id: ruff-format
            name: ruff format
            # Applies formatting (as the old hook did); pre-commit then fails on the
            # modified files, so you re-stage. CI's `--check` run passes afterwards.
            entry: uv run ruff format .
            language: system
            types: [python]
            pass_filenames: false
            stages: [pre-commit]
          - id: ty-check
            name: ty check
            # --error-on-warning matches CI. Without it a ty panic exits 0, so a run
            # that analyzed only part of the project would look like a pass.
            entry: uv run ty check . --error-on-warning
            language: system
            types: [python]
            pass_filenames: false
            stages: [pre-commit]
          - id: pyrefly-check
            name: pyrefly check
            entry: uv run pyrefly check # 0 new vs pyrefly-baseline.json (see pyrefly.toml)
            language: system
            types: [python]
            pass_filenames: false
            stages: [pre-commit]
          - id: cspell
            name: cspell
            entry: bunx cspell --no-must-find-files
            language: system
            # Match every file type cspell.config.yaml checks, so pre-commit
            # catches everything CI's repo-wide run would.
            files: \.(py|md|ini|fodt)$
            stages: [pre-commit]
          - id: check-relative-imports
            name: check relative imports
            entry: bash scripts/check-relative-imports.sh
            language: system
            types: [python]
            pass_filenames: false
            stages: [pre-commit]
          - id: check-kv-imports
            name: check .kv imports resolve
            entry: uv run scripts/check_kv_imports.py
            language: system
            # A Python rename can dangle a .kv "#: import"; run on both file types.
            files: \.(kv|py)$
            pass_filenames: false
            stages: [pre-commit]
          - id: check-gui-keys
            name: check GUI tests press only the remote's keys
            entry: uv run scripts/check_gui_keys.py
            language: system
            types: [python]
            pass_filenames: false
            stages: [pre-commit]
          - id: lint-imports
            name: lint-imports (import-linter contracts)
            entry: uv run lint-imports
            language: system
            types: [python]
            pass_filenames: false
            stages: [pre-commit]
          - id: deptry
            name: deptry (unused/missing/misplaced dependencies)
            entry: uv run deptry .
            language: system
            # Depends on both the source imports and the dependency declarations.
            files: \.(py|toml)$
            pass_filenames: false
            stages: [pre-commit]
          - id: vulture
            name: vulture (dead code)
            entry: uv run vulture
            language: system
            # Whole-program analysis: reads all paths from [tool.vulture], so a
            # deletion elsewhere can revive a finding regardless of the staged file.
            types: [python]
            pass_filenames: false
            stages: [pre-commit]
          - id: pytest
            name: pytest (full suite)
            # screen_metrics asks screeninfo for the monitors at import, which needs an
            # X display; a push from a shell without one (ssh, a second machine) runs
            # the suite on a throwaway Xvfb, as CI does.
            entry: >-
              bash -c 'if [ -z "${DISPLAY:-}" ] && command -v xvfb-run >/dev/null;
              then exec xvfb-run -a uv run pytest; else exec uv run pytest; fi'
            language: system
            pass_filenames: false
            always_run: true
            stages: [pre-push]
          - id: check-censorship-csv
            name: censorship-fixes CSV matches the fixes trees
            # The checker is in the sibling barks-comic-building repo; the script
            # says how it finds it, from a worktree too.
            entry: bash scripts/check-censorship-csv.sh
            language: system
            pass_filenames: false
            # always_run, not files: [censorship-fixes.csv]. The check compares the CSV
            # against the story tables and the on-disk fixes trees, so an edit to
            # comic_book_info.py or a restaged page can invalidate a row the CSV commit
            # never touched. It takes about a second.
            always_run: true
            # Pre-push, not pre-commit: it reads the machine-local comics trees under
            # ~/Books, which a commit should not depend on and CI does not have.
            stages: [pre-push]
          - id: cspell-commit-msg
            name: cspell commit message
            # Piped in, so cspell finds its config from here, the checkout's root. Given
            # the file, it looks for one beside it, and a worktree's message is in the
            # main checkout's .git: it took the main checkout's words, or checked
            # nothing. A pipe, not `< "$1"`: under bunx, stdin redirected from a file
            # read as empty and passed a misspelling. No --config: bunx now and then
            # took it for its own and looked cspell.config.yaml up as a package.
            entry: bash -c 'cat -- "$1" | bunx cspell --no-progress stdin' --
            language: system
            stages: [commit-msg]
