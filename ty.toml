[environment]
python = "./.venv"
# scripts/ holds standalone modules (gui_driver, record_demo) imported by their
# tests via sys.path, so it is a first-party root too.
root = [".", "scripts"]

[src]
exclude = [
    "**/experiments",
    "**/scraps",
    # Vulture whitelist: bare undefined names by design (see the file header).
    "vulture_whitelist.py",
]

[[overrides]]
include = ["src/barks-reader/tests/unit/test_main_screen_nav.py"]

[overrides.rules]
unused-ignore-comment = "ignore"
