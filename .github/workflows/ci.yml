name: CI

# A push or pull request that only changes docs (docs/ or Markdown) runs nothing: no test
# or build reads them. A tag push still runs, as path filters do not apply to tags.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

env:
  # Reproducible, timing-tolerant Hypothesis runs (see root conftest.py).
  HYPOTHESIS_PROFILE: ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Relative import check
        run: bash scripts/check-relative-imports.sh

      - name: GUI tests press only the remote's keys
        run: uv run scripts/check_gui_keys.py

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Generate stubs for gitignored modules
        run: |
          cat > src/barks-reader/src/barks_reader/_version.py <<'STUB'
          COPYRIGHT_YEARS = "2025-2026"
          VERSION = "ci"
          STUB

      - name: Type check with ty
        run: uv run ty check --error-on-warning

      - name: Type check with pyrefly
        run: uv run pyrefly check --progress-bar=no

  import-layering:
    name: Import Layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Check import layering
        run: uv run lint-imports

      - name: Check dependencies (deptry)
        run: uv run deptry .

      - name: Check dead code (vulture)
        run: uv run vulture

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Spell check
        run: bunx cspell

  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libmtdev1t64 xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Generate stubs for gitignored modules
        shell: bash
        run: |
          cat > src/barks-reader/src/barks_reader/_version.py <<'STUB'
          COPYRIGHT_YEARS = "2025-2026"
          VERSION = "ci"
          STUB
          cat > src/comic-utils/src/comic_utils/get_panel_bytes.py <<'STUB'
          def get_decrypted_bytes(data: bytes) -> bytes:
              return data
          STUB

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum uv run pytest

      # The runners have no GPU driver for OpenGL, and Kivy's SDL2 refused the software
      # renderer by asking for an accelerated one ("Failed creating OpenGL pixel
      # format"), so the UI tests were skipped here. with-soft-gl.sh lifts that request
      # (scripts/macos/softgl.c), as on the macOS VirtualBox guest. This opens one Kivy
      # window first and names the renderer, so a runner that cannot draw says so here.
      - name: OpenGL on the runner (macOS)
        if: runner.os == 'macOS'
        run: >-
          bash scripts/macos/with-soft-gl.sh python -c "import os;
          os.environ['KIVY_NO_ARGS'] = '1';
          from kivy.core.window import Window;
          from kivy.graphics import opengl as gl;
          assert Window, 'no Kivy window';
          print('renderer:', gl.glGetString(gl.GL_RENDERER), gl.glGetString(gl.GL_VERSION))"

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/macos/with-soft-gl.sh pytest

      # Windows draws through ANGLE (Direct3D, in software on the runner): its
      # OpenGL is GDI Generic 1.1, below Kivy's 2.0, as Build Verification's smoke
      # tests found. With a window to draw in, the Kivy UI tests run here too.
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        env:
          KIVY_DPI: "96"
          KIVY_METRICS_DENSITY: "1"
          KIVY_METRICS_FONTSCALE: "1"
          KIVY_GL_BACKEND: "angle_sdl2"
        run: uv run pytest

  diff-coverage:
    name: Diff Coverage
    # Enforce coverage on changed lines only (see scripts/diff-cover.sh for the
    # rationale). A PR is held to its base branch; a push to main, to the commit main
    # was at before the push - commits go straight to main here, so a PR-only check
    # never ran.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # diff-cover needs the base branch history to compute the diff

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libmtdev1t64 xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Generate stubs for gitignored modules
        shell: bash
        run: |
          cat > src/barks-reader/src/barks_reader/_version.py <<'STUB'
          COPYRIGHT_YEARS = "2025-2026"
          VERSION = "ci"
          STUB
          cat > src/comic-utils/src/comic_utils/get_panel_bytes.py <<'STUB'
          def get_decrypted_bytes(data: bytes) -> bytes:
              return data
          STUB

      - name: Run tests with coverage
        run: xvfb-run --auto-servernum uv run pytest -q --cov --cov-report=xml

      - name: Choose what the changed lines are measured against
        id: compare
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            ref="origin/$BASE_REF"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            ref="$BEFORE"  # main before this push: every commit the push brought
          else
            ref="HEAD~1"  # a first push, or one that rewrote history: the last commit
          fi
          echo "Measuring changed lines against $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Enforce coverage on changed lines
        env:
          COMPARE: ${{ steps.compare.outputs.ref }}
        run: uv run diff-cover coverage.xml --compare-branch="$COMPARE" --fail-under=80
