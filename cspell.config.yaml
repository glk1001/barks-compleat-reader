version: "0.2"
language: "en"

# Python source files, OpenDocument flat text, Markdown, and the website's own text
files:
  - "**/*.py"
  - "**/*.fodt"
  - "**/*.md"
  - "**/*.ini"
  # The website is hand-written prose that ships to readers, so it is worth checking.
  # Scoped to website/ rather than "**/*.html": index.html is a stub redirect and
  # docs/loc-history/loc-growth.html is generated, and neither is prose worth gating.
  # The chapter manifests are generated by scripts/record_demo.py, but their titles
  # are the beat captions burned into the videos, so a typo is worth catching twice.
  - "website/*.html"
  - "website/*.json"

# Respect .gitignore, then add ruff/ty-specific excludes
useGitignore: true
ignorePaths:
  - "data/**"
  - "**/experiments/**"
  - "**/scraps/**"
  - "**/get_panel_bytes.py"
  # Generated verbatim from Michael Barrier's bibliography (proper nouns, OCR typos).
  - "**/barks_bibliography.py"
  # Vulture whitelist: bare identifiers, not prose.
  - "**/vulture_whitelist.py"

# GitHub Security Advisory IDs (GHSA-xxxx-xxxx-xxxx). The three segments are random
# hash fragments, never prose, and a new one arrives with every advisory - so match
# them by shape rather than growing cspell-words.txt a dead word at a time. Cited in
# dependency-bump commit messages, which the commit-msg hook spell-checks.
ignoreRegExpList:
  - "GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}"

# Enable Python built-in dictionary plus word lists (global and per-package)
dictionaryDefinitions:
  - name: project
    path: "./cspell-words.txt"
    addWords: true
  - name: comic-utils
    path: "./src/comic-utils/cspell-words.txt"
    addWords: true
  - name: barks-fantagraphics
    path: "./src/barks-fantagraphics/cspell-words.txt"
    addWords: true
  - name: barks-reader
    path: "./src/barks-reader/cspell-words.txt"
    addWords: true

dictionaries:
  - python
  - project
  - comic-utils
  - barks-fantagraphics
  - barks-reader

# Per-file-type overrides
overrides:
  - filename: "**/*.fodt"
    ignoreRegExpList:
      # Skip all XML tags except <text:p> and </text:p> (those contain readable prose)
      - "<(?!\\/?text:p[\\s>/])[^>]*>"
      # Skip XML comments (may contain '>' inside, so handled separately)
      - "<!--[\\s\\S]*?-->"
      # Skip word fragments split across inline <text:span> elements (e.g. "evol<text:span...>ved</text:span>")
      # Trade-off: words entirely inside a span are also skipped
      - "[A-Za-z]*<text:span\\b[^>]*>[A-Za-z]*</text:span>[A-Za-z]*"
