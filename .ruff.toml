extend = ".ruff-base.toml"

exclude = [
    "experiments",
    "scraps",
    # Vulture whitelist: bare undefined names by design (see the file header).
    "vulture_whitelist.py",
]

[lint]
ignore = [
    "PLR0913",
    "TD002",
]

[lint.per-file-ignores]
"scripts/*" = ["INP001"]
# Root pytest conftest: loaded by pytest, not imported as a package module.
"conftest.py" = ["INP001"]
