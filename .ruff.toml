extend = ".ruff-base.toml"

exclude = [
    "experiments",
    "scraps",
    # Vulture whitelist: bare undefined names by design (see the file header).
    "vulture_whitelist.py",
]

[lint]
ignore = [
    # Copyright headers: this repo has none, no LICENSE file, and ships a compiled
    # binary rather than source. Stabilized out of preview in ruff 0.16.0, so
    # `select = ["ALL"]` started demanding a header on all 339 files.
    "CPY001",
    "PLR0913",
    # Sibling of PLR0913 (also stabilized in ruff 0.16.0): the hits are dependency-
    # injection constructors, which legitimately take many collaborators. Tracked as
    # keyword-only debt in docs/BACKLOG.md rather than enforced as a gate.
    "PLR0917",
    "TD002",
]

[lint.per-file-ignores]
"scripts/*" = ["INP001"]
# Root pytest conftest: loaded by pytest, not imported as a package module.
"conftest.py" = ["INP001"]
