# cspell:ignore cifs testparm
# A read-only Samba share of the comic library, for build-check on another machine
# (scripts/setup-build-share.sh there mounts it for that stage alone).
#
# Add it to this machine's Samba once:
#   sudo tee -a /etc/samba/smb.conf < scripts/samba/barks-library.conf
#   testparm -s && sudo systemctl reload smbd
#
# Several folders in the library are symlinks onto another drive (/mnt/2tb_drive).
# A share passes a symlink on as a link, which on the other machine points at a
# path that does not exist there; "wide links" makes Samba follow it here and serve
# the folder's contents instead. Samba allows that only with "allow insecure wide
# links = yes" in [global] (set on this machine already). Guest and read-only, as
# this machine's other shares: anything on this network can read the library,
# nothing can write it. The path is this machine's; edit it for another.

[BarksLibrary]
   comment = Carl Barks library, read-only (build-check on other machines)
   path = /home/greg/Books/Carl Barks
   read only = yes
   guest ok = yes
   force user = greg
   follow symlinks = yes
   wide links = yes
